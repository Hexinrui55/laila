<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>灵感 · AI 智能文案助手</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#243047;background:#f5f6fb;line-height:1.6}*{box-sizing:border-box}body{margin:0}button,textarea,select{font:inherit}button{cursor:pointer;transition:.18s}button:disabled{cursor:wait;opacity:.6}button:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b5a4ff;outline-offset:3px}header{max-width:1100px;margin:auto;padding:28px 24px;display:flex;align-items:center;gap:12px}.logo{background:#7054de;color:white;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:26px}.brand{font-weight:750;font-size:20px}.badge{margin-left:auto;font-size:12px;color:#756986;background:#ebe8f5;padding:5px 12px;border-radius:20px}main{max-width:1000px;margin:22px auto 60px;padding:0 24px}.intro{text-align:center;margin-bottom:34px}.eyebrow{font-size:12px;color:#785bd0;letter-spacing:3px;font-weight:700}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1px;margin:12px 0}p{margin:8px 0;color:#7b8293}.layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}.card{background:white;border:1px solid #e8e9f1;border-radius:24px;padding:28px;box-shadow:0 8px 32px #34345605}.section{font-size:14px;font-weight:700;display:block;margin-bottom:12px}.num{color:#927bd4;margin-right:8px;font-size:12px}.tabs{display:flex;gap:8px;margin-bottom:26px}.tab{flex:1;border:1px solid #e8e9ef;background:#fafbfe;border-radius:12px;padding:12px 4px;color:#747b8b;font-size:13px}.tab[aria-pressed=true]{background:#f0eaff;border-color:#b5a0ef;color:#6543bf;font-weight:650}textarea{width:100%;min-height:164px;resize:vertical;border:1px solid #e1e3ed;border-radius:14px;padding:14px;background:#fcfcfe;color:#30384b}textarea::placeholder{color:#a0a5b4}.hint{font-size:12px;display:flex;justify-content:space-between;color:#969bab;margin:6px 0 23px}.params{display:grid;grid-template-columns:1fr 1fr;gap:14px}select{width:100%;padding:11px;border:1px solid #e3e4ee;border-radius:10px;background:white;color:#50576b}.primary{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(110deg,#7955df,#615bdb);color:white;font-weight:700;margin-top:26px;box-shadow:0 6px 16px #7054de28}.primary:hover{filter:brightness(1.06)}.sub{border:1px solid #e2e4ed;background:white;color:#656d80;border-radius:9px;padding:8px 13px;font-size:13px}.result-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.result-head h2{font-size:17px;margin:0}.pill{color:#8e81b0;background:#f4f0fc;border-radius:20px;padding:3px 9px;font-size:11px}.empty{min-height:310px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.spark{font-size:34px;color:#9c87db;background:#f4effe;width:70px;height:70px;border-radius:22px;display:grid;place-items:center;margin-bottom:16px}.empty strong{font-size:15px}.empty p{font-size:13px;max-width:230px}.result{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.95;padding:22px 0;min-height:265px}.actions{display:flex;gap:10px;border-top:1px solid #eeeef4;padding-top:18px;flex-wrap:wrap}.note{font-size:12px;color:#9b9eac;margin-top:16px}.error{color:#c13c58;font-size:13px;margin:8px 0}.status{font-size:13px;color:#7153be;min-height:22px;margin-top:12px;overflow-wrap:anywhere}footer{text-align:center;font-size:12px;color:#9a9faf;margin-top:30px}[hidden]{display:none!important}@media(max-width:720px){main{margin-top:12px;padding:0 16px}.layout{grid-template-columns:1fr;gap:18px}.card{padding:22px;border-radius:20px}header{padding:20px 18px}.badge{font-size:10px}.intro{margin-bottom:24px}.empty{min-height:210px}.tabs{gap:6px}}
.layout>*{min-width:0}.params{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{gap:8px;flex-wrap:wrap}.pill{overflow-wrap:anywhere}.logo{flex-shrink:0}header{flex-wrap:wrap}
</style>
</head>
<body>
<header><div class="logo" aria-hidden="true">✦</div><div class="brand">灵感<span style="font-weight:400;color:#9295a5;font-size:13px"> / AI Writer</span></div><span class="badge">让表达，多一点可能</span></header>
<main><div class="intro"><div class="eyebrow">YOUR EVERYDAY WRITING PARTNER</div><h1>好文案，从一个想法开始。</h1><p>AI 智能文案助手，把你的灵感变成清晰、有温度的表达。</p></div>
<div class="layout"><section class="card" aria-label="写作设置"><span class="section"><span class="num">01</span>选择创作场景</span><div class="tabs" role="group" aria-label="文案类型"><button class="tab" aria-pressed="true" data-type="社交媒体文案">☀ 社交媒体</button><button class="tab" aria-pressed="false" data-type="工作总结">▤ 工作总结</button><button class="tab" aria-pressed="false" data-type="活动宣传语">✧ 活动宣传</button></div>
<label class="section" for="request"><span class="num">02</span>说说你的写作需求</label><textarea id="request" maxlength="2000" placeholder="例如：为周末的城市徒步写一段朋友圈文案，突出放松心情和沿途风景。" aria-describedby="error"></textarea><div id="error" class="error" role="alert" hidden></div><div class="hint"><span>主题、关键词或具体需求都可以</span><span id="count">0 / 2000</span></div>
<span class="section"><span class="num">03</span>调整表达偏好</span><div class="params"><label>文案风格<select id="style"><option>自然亲切</option><option>专业正式</option><option>活泼创意</option></select></label><label>文案长度<select id="length"><option>简短</option><option selected>适中</option><option>详细</option></select></label></div><button id="generate" class="primary">✦ 生成文案</button><div style="text-align:center;margin-top:12px"><button id="clear" class="sub">清空内容</button></div><div class="note">本地模拟生成 · 无需联网 · 需求不会上传</div></section>
<section class="card" id="resultCard" aria-busy="false"><div class="result-head"><h2>你的灵感草稿</h2><span class="pill" id="tag">等待创作</span></div><div id="empty" class="empty"><div class="spark" aria-hidden="true">✧</div><strong>下一段好文案，在这里诞生</strong><p>填写左侧的需求，剩下的交给灵感。<br>每个想法，都值得被好好表达。</p></div><div id="result" class="result" hidden tabindex="0" aria-label="生成结果"></div><div id="actions" class="actions" hidden><button id="copy" class="sub">复制文案</button><button id="again" class="sub">↻ 重新生成</button></div><div id="status" class="status" role="status" aria-live="polite"></div><div class="note">模拟草稿仅供参考，可根据实际情况调整后使用。</div></section></div><footer>灵感 AI · 让写作轻一点，让表达好一点</footer></main>
<script>
const $=id=>document.getElementById(id);let type='社交媒体文案',version=0,job=0,timer;const examples=['例如：为周末的城市徒步写一段朋友圈文案，突出放松心情和沿途风景。','例如：本周完成产品需求评审、修复登录问题，下周计划推进新版测试。','例如：宣传周六的社区读书会，主题是交换好书，欢迎邻居报名参与。'];
document.querySelectorAll('.tab').forEach((b,i)=>b.onclick=()=>{type=b.dataset.type;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',String(t===b)));$('request').placeholder=examples[i]});
$('request').oninput=()=>{$('count').textContent=$('request').value.length+' / 2000';$('error').hidden=true;$('request').removeAttribute('aria-invalid')};
function compose(input,style,len,scene,n){const v=n%3;const subject=input;const openings=style==='专业正式'?['围绕本次主题，整理如下：','以下为本次内容的表达草稿：','结合所提供的信息，形成以下文案：']:style==='活泼创意'?['叮！新的灵感已上线 ✨','给日常加一点新鲜感！','准备好，让这个想法发光！']:['有些想法，值得认真记录。','把这一刻，分享给你。','从一个小小的想法开始。'];let body;
if(scene==='工作总结'){body=[['工作内容','本次工作围绕以下事项展开：'+subject],['阶段梳理','以上述事项为线索，整理已完成内容、推进中的任务及需要协作的问题，具体进展以实际记录为准。'],['后续计划','下一步可逐项明确优先级、负责人及完成时间，及时同步进展，并对关键问题持续跟进。']];}
else if(scene==='活动宣传语'){body=[['一起参与，让想法成为相遇','本次活动主题与亮点：'+subject],['值得期待','把兴趣变成一次真实的交流，把期待留给共同参与的时刻。欢迎带着你的想法，发现更多可能。'],['参与邀请','感兴趣的话，欢迎了解活动安排并参与。具体时间、地点和报名方式，请以主办方公布的信息为准。']];}
else{body=[['今日灵感','想和你分享：'+subject],['留住这一刻','生活里的小小期待，常常藏在这些具体的片段里。用自己的节奏去体验，也给平凡的一天留一点新鲜感。'],['一起聊聊','你有什么相关的经历或想法？欢迎分享，让这份灵感继续生长。']];}
const order=v===1?'换个角度记录这份想法。':v===2?'让值得表达的内容，被更多人看见。':'把想法写下来，就是一个好的开始。';const size=len==='简短'?1:len==='适中'?2:3;return openings[v]+'\n\n'+body.slice(0,size).map(([h,t])=>h+'\n'+t).join('\n\n')+'\n\n'+(style==='专业正式'?'以上内容可结合实际信息进一步完善。':style==='活泼创意'?order+' ✨':order)}
function busy(on){$('generate').disabled=on;$('again').disabled=on;$('generate').textContent=on?'✦ 正在生成…':'✦ 生成文案';$('resultCard').setAttribute('aria-busy',String(on))}
function generate(){const input=$('request').value.trim();if(!input){$('error').textContent='请先填写写作需求，主题或关键词都可以。';$('error').hidden=false;$('request').setAttribute('aria-invalid','true');$('request').focus();return}const scene=type,style=$('style').value,len=$('length').value,token=++job;busy(true);$('status').textContent='正在整理你的想法，请稍候…';$('tag').textContent='创作中';timer=setTimeout(()=>{if(token!==job)return;$('result').textContent=compose(input,style,len,scene,version++);$('result').hidden=false;$('empty').hidden=true;$('actions').hidden=false;$('tag').textContent=scene+' · '+len;$('status').textContent='文案已生成，可以复制或重新生成。';busy(false)},850)}
$('generate').onclick=generate;$('again').onclick=generate;
$('clear').onclick=()=>{job++;clearTimeout(timer);busy(false);$('request').value='';$('request').oninput();$('result').textContent='';$('result').hidden=true;$('actions').hidden=true;$('empty').hidden=false;$('tag').textContent='等待创作';$('status').textContent='输入和结果已清空。';$('request').focus()};
$('copy').onclick=async()=>{const text=$('result').textContent;if(!text)return;const token=job;let ok=false;try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true}}catch(e){}if(token!==job)return;if(!ok){const box=document.createElement('textarea');box.value=text;box.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01';document.body.append(box);box.focus();box.select();box.setSelectionRange(0,text.length);try{ok=document.execCommand('copy')}catch(e){}box.remove()}if(ok){$('status').textContent='已复制到剪贴板。';$('copy').focus()}else{const selection=window.getSelection(),range=document.createRange();range.selectNodeContents($('result'));selection.removeAllRanges();selection.addRange(range);$('result').focus();$('status').textContent='浏览器限制自动复制，已选中文案。请按 Ctrl+C / Command+C，手机可长按结果选择复制。'}};
</script>
</body>
</html>
